[pytest]
# tests 是测试代码，app 是为了收集 docstring 里的 >>> 例子（--doctest-modules）。
# 为什么要跑 doctest？
#   sanitize_detail 的 docstring 里写着"输入这个会输出那个"，那就是承诺。
#   不跑的话，代码改了、注释没改，注释会一直骗人 —— 而注释恰恰是
#   最容易被相信的东西。写进 testpaths 的只能是包（有 __init__.py），
#   所以 app 也在列表里。
testpaths = tests app
pythonpath = .
addopts = -v --strict-markers --doctest-modules
markers =
    real_api: 需要真实大模型 API 的测试（默认不跑，mock 测试请勿加此标记）
